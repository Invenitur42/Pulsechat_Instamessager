<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PulseChat</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ===================== AUTH SCREEN ===================== -->
  <section id="authScreen" class="auth-screen">
    <div class="auth-card">
      <h1 class="brand">Pulse<span>Chat</span></h1>
      <p class="tagline">Text, photos, voice notes and video clips — all in one thread.</p>

      <div class="tabs">
        <button type="button" class="tab active" data-tab="login">Log in</button>
        <button type="button" class="tab" data-tab="register">Sign up</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label>Username
          <input name="username" autocomplete="username" required />
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <p class="error" id="loginError"></p>
        <button type="submit" class="primary">Log in</button>
      </form>

      <form id="registerForm" class="auth-form" hidden>
        <label>Username
          <input name="username" pattern="[a-zA-Z0-9_]{3,20}" title="3-20 letters, numbers or underscores" required />
        </label>
        <label>Password
          <input name="password" type="password" pattern="[a-zA-Z0-9]{10,20}" title="10-20 alphanumeric characters" required />
        </label>
        <p class="hint">Password: 10-20 letters/numbers, no symbols required.</p>
        <p class="error" id="registerError"></p>
        <button type="submit" class="primary">Create account</button>
      </form>
    </div>
  </section>

  <!-- ===================== MAIN APP ===================== -->
  <section id="appScreen" class="app-screen" hidden>
    <aside class="sidebar">
      <div class="me">
        <label class="avatar" title="Change photo">
          <img id="myAvatar" src="/img/default-avatar.svg" alt="" />
          <input type="file" id="avatarInput" accept="image/*" hidden />
        </label>
        <div>
          <div class="me-name" id="myUsername"></div>
          <div class="me-status">● online</div>
        </div>
        <button type="button" id="logoutBtn" class="ghost small">Log out</button>
      </div>

      <button type="button" id="newChatBtn" class="primary full">+ New chat</button>

      <div id="conversationList" class="convo-list"></div>
    </aside>

    <main class="chat-pane">
      <div id="emptyState" class="empty-state">
        <p>Select a conversation, or start a new one.</p>
      </div>

      <div id="chatArea" class="chat-area" hidden>
        <header class="chat-header">
          <img id="chatAvatar" class="avatar-sm" src="/img/default-avatar.svg" alt="" />
          <div>
            <div id="chatTitle" class="chat-title"></div>
            <div id="chatTyping" class="chat-typing"></div>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="composer" class="composer">
          <label class="icon-btn" title="Send an image">
            📷
            <input type="file" id="imageInput" accept="image/*" hidden />
          </label>
          <button type="button" id="audioBtn" class="icon-btn" title="Record a voice note">🎙️</button>
          <button type="button" id="videoBtn" class="icon-btn" title="Record a video clip">🎥</button>
          <input type="text" id="textInput" placeholder="Type a message…" autocomplete="off" />
          <button type="submit" class="primary">Send</button>
        </form>

        <div id="recordBar" class="record-bar" hidden>
          <span id="recordLabel">Recording…</span>
          <video id="videoPreview" autoplay muted playsinline hidden></video>
          <button type="button" id="stopRecordBtn" class="danger small">Stop &amp; send</button>
          <button type="button" id="cancelRecordBtn" class="ghost small">Cancel</button>
        </div>
      </div>
    </main>
  </section>

  <!-- ===================== NEW CHAT MODAL ===================== -->
  <dialog id="newChatDialog">
    <form id="newChatForm">
      <h3>Start a new chat</h3>
      <label class="check-row">
        <input type="checkbox" id="isGroupCheck" /> Make this a group
      </label>
      <input id="groupNameInput" placeholder="Group name" hidden />
      <div id="userPicker" class="user-picker"></div>
      <div class="dialog-actions">
        <button type="button" id="cancelNewChat" class="ghost">Cancel</button>
        <button type="submit" class="primary">Start chat</button>
      </div>
    </form>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
